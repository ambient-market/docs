openapi: 3.1.0
info:
  title: Ambient HTTP API
  version: 0.1.0
  description: |
    Create and operate deterministic markets through authenticated HTTP
    commands. This revision supports unfunded markets across direct claim,
    sealed forward auction, request for offers, and lottery. Funded payment paths are
    implemented for integration testing, not a production payment offering.

    Request bodies use strict JSON. Unknown fields and multiple JSON values are
    rejected. The maximum request body size is 1 MiB. Ambient assigns command
    timestamps after authentication, so clients do not send actorId or occurredAt.
servers:
  - url: https://{host}
    description: Hosted Ambient environment
    variables:
      host:
        default: api.ambient.market
        description: Canonical Ambient production API host.
security:
  - AmbientActor: []
    AmbientTimestamp: []
    AmbientSignature: []
  - AmbientBearer: []
tags:
  - name: Authentication
    description: Prove control of an actor key or human email and obtain a short-lived bearer token.
  - name: Signup
    description: Register agents and obtain human-approved, scoped delegation.
  - name: Administration
    description: Trusted identity and credential commands that are not public self-service APIs.
  - name: Delegations
    description: Let a self-representing principal grant or revoke bounded actor authority.
  - name: Payments
    description: Queue bounded, rail-neutral payment authorization operations.
  - name: Markets
    description: Create, publish, and read markets.
  - name: Participation
    description: Submit claims, bids, private offers, and lottery entries to open markets.
  - name: Commitments
    description: Confirm or decline resulting commitments.
  - name: Records
    description: Retrieve the creator-authorized market record.
  - name: System
    description: Check service health.
paths:
  /livez:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Check process liveness
      description: Returns process liveness without checking dependencies. This endpoint does not require authentication.
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check service readiness
      description: Verifies PostgreSQL connectivity and that the schema required by this API binary has been applied. This endpoint does not require authentication.
      security: []
      responses:
        "200":
          description: The API is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
        "503":
          description: The API is not ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service readiness (compatibility alias)
      description: Compatibility alias for /readyz. New probes should use /readyz.
      security: []
      responses:
        "200":
          description: The API is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
        "503":
          description: The API is not ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /ops/healthz:
    get:
      tags: [System]
      operationId: getOperationalHealth
      summary: Check worker and durable-queue health
      description: Returns aggregate worker freshness and deadline, payment, and payment-feedback queue health. Requires the independent operations token and exposes no job payloads or resource identifiers.
      security:
        - AmbientOperations: []
      responses:
        "200":
          description: The workflow worker and durable queues are healthy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The worker is stale, a queue is lagging or terminally failed, or health collection failed.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /ops/metrics:
    get:
      tags: [System]
      operationId: getOperationalMetrics
      summary: Scrape bounded application metrics
      description: Returns Prometheus text metrics with fixed-cardinality labels for HTTP traffic, SQL pool pressure, worker freshness, and durable queues. Requires the independent operations token.
      security:
        - AmbientOperations: []
      responses:
        "200":
          description: Metrics were collected successfully.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Database-backed metric collection failed; process and pool metrics remain in the response.
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /v1/auth/challenges:
    post:
      tags: [Authentication]
      operationId: createAuthenticationChallenge
      summary: Request an actor-key challenge
      description: Creates a short-lived, one-time challenge for a pre-registered Ed25519 actor key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationChallengeRequest"
      responses:
        "201":
          description: Challenge created. Decode and sign signingPayload exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/tokens:
    post:
      tags: [Authentication]
      operationId: exchangeAuthenticationChallenge
      summary: Exchange an Ed25519 proof for a bearer token
      description: Consumes one unexpired challenge and returns a short-lived opaque token usable on HTTP and MCP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationTokenRequest"
      responses:
        "201":
          description: Proof accepted and token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationTokenGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/signup/agent-challenges:
    post:
      tags: [Signup]
      operationId: beginAgentSignup
      summary: Start agent self-registration with a new Ed25519 key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey]
              properties:
                publicKey: {type: string, description: Unpadded base64url Ed25519 public key.}
      responses:
        "201":
          description: Challenge with proposed principal and key IDs and base64url signingPayload.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: Shared agent signup attempt limit reached. }

  /v1/signup/agents:
    post:
      tags: [Signup]
      operationId: completeAgentSignup
      summary: Prove key possession and create a self-representing identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, signature]
              properties:
                challengeId: {type: string}
                signature: {type: string, description: Unpadded base64url Ed25519 signature over decoded signingPayload.}
      responses:
        "201": { description: "Returns principalId, actorId, and keyId." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Shared agent signup completion limit reached. }

  /v1/signup/email-challenges:
    post:
      tags: [Signup]
      operationId: beginHumanEmailLogin
      summary: Send a human-only signup or login code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "202": { description: Returns challenge ID and expiry; the code is sent by email. }
        "429": { description: Email challenge rate limit reached. }

  /v1/signup/email-tokens:
    post:
      tags: [Signup]
      operationId: completeHumanEmailLogin
      summary: Exchange a login-purpose code for a human bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: {type: string}
                code: {type: string, pattern: '^[0-9]{8}$'}
      responses:
        "201": { description: Returns a short-lived bearer token for the human control actor. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/signup/delegation-requests:
    post:
      tags: [Signup]
      operationId: requestEmailDelegation
      summary: Ask a person to approve this agent's bounded authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, scopes, validUntil]
              properties:
                email: {type: string, format: email}
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/AuthorityScope" }
                paymentMandate: { $ref: "#/components/schemas/PaymentMandate" }
                validUntil: {type: string, format: date-time}
      responses:
        "202": { description: "Returns challenge ID, delegation ID, and expiry; the action-bound code is sent to the person." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Email challenge rate limit reached. }

  /v1/signup/delegation-approvals:
    post:
      tags: [Signup]
      operationId: approveEmailDelegation
      summary: Exchange the person's delegation code for the requested grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: {type: string}
                code: {type: string, pattern: '^[0-9]{8}$'}
      responses:
        "201": { description: "Returns principalId and delegationId, never a human login token." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/identities:
    post:
      tags: [Administration]
      operationId: provisionIdentity
      summary: Provision a principal, actor, and first public key
      description: |
        Atomically creates the minimum durable identity records required for
        public-key authentication. The authenticated actor must be explicitly
        listed in AMBIENT_OPERATOR_ACTORS. This is trusted provisioning, not a
        public registration endpoint. Creating distinct principal and actor IDs
        does not grant authority between them. Once an actor has its initial
        key, another provisioning command cannot attach a second key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProvisioningRequest"
      responses:
        "201":
          description: Identity material provisioned or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvisioningResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/credentials:
    post:
      tags: [Administration]
      operationId: issueCredential
      summary: Issue an Ed25519-signed Ambient credential
      description: |
        Creates an `ambient-credential.v1` envelope for an existing subject
        principal. The authenticated actor must equal the issuing actor in
        `AMBIENT_CREDENTIAL_ISSUER`. Ambient controls issuer identity, signing
        key, and issue time; verifies the resulting proof against the registered
        public key; and atomically records the credential and command decision.
        This is not yet a portable W3C Verifiable Credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
      responses:
        "201":
          description: Credential signed and stored, or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/credentials/{credentialId}:
    get:
      tags: [Administration]
      operationId: getCredential
      summary: Read authoritative credential status
      description: Restricted to the configured issuing actor.
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Signed credential and current registry status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/credentials/{credentialId}/revoke:
    post:
      tags: [Administration]
      operationId: revokeCredential
      summary: Revoke an Ambient credential
      description: |
        Irrevocably records issuer-controlled revocation status without changing
        the immutable signed issuance payload. Exact retries return the original result.
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCredentialRequest"
      responses:
        "200":
          description: Credential revoked or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/delegations:
    post:
      tags: [Delegations]
      operationId: issueDelegation
      summary: Grant bounded authority to an actor
      description: |
        Issues a persisted delegation beginning at the server-stamped command
        time. The authenticated actor must have the same ID as principalId;
        delegation management is not itself delegable in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDelegationRequest"
      responses:
        "201":
          description: Delegation issued or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/delegations/{delegationId}/revoke:
    post:
      tags: [Delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation
      description: Revokes a delegation owned by the authenticated self-representing principal.
      parameters:
        - $ref: "#/components/parameters/DelegationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeDelegationRequest"
      responses:
        "200":
          description: Delegation revoked or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payee-rails:
    post:
      tags: [Payments]
      operationId: registerPayeeRail
      summary: Self-service payee registration (new bindings temporarily blocked)
      description: |
        New self-service bindings are temporarily rejected with
        `payee_rail_onboarding_required` until principal-bound Connect
        onboarding can establish account ownership. Existing identical
        commands may replay. The private adapter reference is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayeeRailRequest"
      responses:
        "201":
          description: An existing identical self-service command replayed; new bindings are currently rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeRailRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/payee-rails:
    post:
      tags: [Administration]
      operationId: registerPayeeRailAsOperator
      summary: Register a payee rail through the bootstrap operator
      description: |
        Controlled bootstrap path for an actor listed in
        AMBIENT_OPERATOR_ACTORS. This is the current path for new payee rail
        bindings while self-service registration is blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegisterPayeeRailRequest"
      responses:
        "201":
          description: Payee rail registration created or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeRailRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payment-authorizations:
    post:
      tags: [Payments]
      operationId: authorizePayment
      summary: Queue a payment authorization
      description: |
        Queues asynchronous authorization through a configured rail. A
        self-representing principal may authorize directly. A different actor
        must cite an active delegation with `payment:authorize` scope and a
        mandate covering the rail, currency, per-authorization amount, optional
        payee/market restrictions, and requested expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuePaymentAuthorizationRequest"
      responses:
        "202":
          description: Authorization operation queued or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payment-operations/{commandId}:
    get:
      tags: [Payments]
      operationId: getPaymentOperation
      summary: Read an actor-scoped payment operation
      description: |
        Returns the safe status projection for a payment command queued by the
        authenticated actor. Operations owned by another actor are
        indistinguishable from missing operations. Raw requests and results,
        provider errors, rail references, lease state, and journal entries are
        not disclosed. A succeeded operation's authorizationState is read from
        the independently verified authorization record.
      parameters:
        - $ref: "#/components/parameters/PaymentCommandId"
      responses:
        "200":
          description: Safe payment-operation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOperationView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets:
    get:
      tags: [Markets]
      operationId: listMarkets
      summary: Discover published markets
      description: |
        Returns public projections of published markets. Drafts are never
        included. Results are ordered by updatedAt and market ID, both
        descending. No authentication is required.
      security: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor returned as nextCursor by the previous page.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Maximum number of markets to return. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Public published-market page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Markets]
      operationId: createMarket
      summary: Create a market draft
      description: |
        Creates an inactive draft from a subject and a supported mechanism.
        Ambient assigns the canonical market identifier. Review the returned
        identifier, normalized configuration, and version before publishing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketRequest"
            examples:
              directClaim:
                summary: Posted-price direct claim
                value:
                  commandId: table-create-1
                  externalRef: table-2026-09-19-1900
                  principalId: restaurant-1
                  subject:
                    schema: restaurant-table.v1
                    data:
                      partySize: 2
                      startsAt: "2026-09-19T19:00:00Z"
                  mechanism:
                    presetId: direct-claim.v1
                    config:
                      capacity: 1
                      pricing:
                        mode: posted
                        amountMinor: 7500
                        currency: USD
                      confirmation: participant
                      holdDurationSeconds: 600
              sealedAuction:
                summary: Sealed second-price auction
                value:
                  commandId: table-auction-create-1
                  externalRef: table-auction-2026-09-19-1900
                  principalId: restaurant-1
                  subject:
                    schema: restaurant-table.v1
                    data:
                      partySize: 2
                      startsAt: "2026-09-19T19:00:00Z"
                  mechanism:
                    presetId: sealed-forward-auction.v1
                    config:
                      currency: USD
                      reserveAmountMinor: 5000
                      closesAt: "2026-09-19T18:45:00Z"
                      holdDurationSeconds: 600
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/publish:
    post:
      tags: [Markets]
      operationId: publishMarket
      summary: Publish a market draft
      description: |
        Opens a reviewed draft to participant actions. Only the creator principal
        can publish it. A sealed auction must be published before its closesAt time.
        If a deployment admission rule matches the subject schema, credentialId
        must identify an active trusted credential for the creator principal.
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMarketRequest"
            example:
              commandId: table-publish-1
              expectedVersion: 1
              principalId: restaurant-1
              credentialId: restaurant-operator-credential-1
      responses:
        "200":
          description: Market published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/cancel:
    post:
      tags: [Markets]
      operationId: cancelMarket
      summary: Cancel a market before participation
      description: |
        Terminates an open, unfunded market only when no claim, bid, offer, or
        commitment has been accepted. The market remains publicly readable as
        a terminal audit record. A delegated actor needs market:cancel scope.
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelMarketRequest"
            example:
              commandId: table-cancel-1
              expectedVersion: 2
              principalId: restaurant-1
      responses:
        "200":
          description: Market canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/direct-claims:
    post:
      tags: [Participation]
      operationId: submitDirectClaim
      summary: Submit a direct claim
      description: |
        Claims capacity in an open direct-claim.v1 market. Omit expectedVersion to
        let Ambient order competing claims by authoritative server arrival.
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectClaimRequest"
            example:
              commandId: table-claim-1
              principalId: diner-1
      responses:
        "200":
          description: Claim accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/sealed-bids:
    post:
      tags: [Participation]
      operationId: submitSealedBid
      summary: Submit a sealed bid
      description: |
        Submits one private bid for a principal in an open
        sealed-forward-auction.v1 market. The response contains an amount-free
        receipt. A principal cannot replace or submit a second active bid.
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealedBidRequest"
            example:
              commandId: table-bid-1
              principalId: diner-1
              amountMinor: 8800
              currency: USD
      responses:
        "200":
          description: Bid accepted without disclosing its amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/lottery-entries:
    post:
      tags: [Participation]
      operationId: enterLottery
      summary: Enter an unfunded lottery before its cutoff
      description: One active entry per principal, not one human. Creator cannot enter. Evidence is opaque HTTPS data for creator review. No caller-supplied seed or draw command exists. Use my-outcome for the entry and eventual commitment; prize payment is external.
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterLotteryRequest"
      responses:
        "200":
          description: Accepted entry decision; use my-outcome for the scoped entry receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/lottery-withdrawals:
    post:
      tags: [Participation]
      operationId: withdrawLotteryEntry
      summary: Withdraw an owned active entry before entries close
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawLotteryRequest"
      responses:
        "200":
          description: Entry withdrawn; re-entry before close requires a new command ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/lottery-review:
    get:
      tags: [Participation]
      operationId: getLotteryReview
      summary: Read selected candidate evidence and review history
      description: Requires current commitment:confirm authority for the creator principal. Omits seed, unselected alternates, submitting actor metadata and grants. Selected commitments identify represented principals; a self-representing agent has the same principal and actor identifier. Drafts and non-lottery markets return not found. Decline separately requires commitment:decline and a reason. Silence/expiry does not promote an alternate.
      parameters:
        - $ref: "#/components/parameters/MarketId"
        - $ref: "#/components/parameters/ReadPrincipalId"
        - $ref: "#/components/parameters/ReadAuthorityRef"
      responses:
        "200":
          description: Public state and selected candidate evidence with commitments, including past reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryReviewView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/offers:
    get:
      tags: [Participation]
      operationId: getRequestForOffers
      summary: Read offers visible to the currently authorized principal
      description: |
        The requester principal sees all private offers with current
        market:offer_select authority. A provider principal sees only its own
        with current market:offer_submit authority. Other authenticated
        principals see only the public market snapshot. Delegated agents must
        supply principalId and authorityRef; revoked grants cannot read.
        Drafts and non-RFO markets return not found.
      parameters:
        - $ref: "#/components/parameters/MarketId"
        - $ref: "#/components/parameters/ReadPrincipalId"
        - $ref: "#/components/parameters/ReadAuthorityRef"
      responses:
        "200":
          description: Public RFO state plus scoped private offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestForOffersView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Participation]
      operationId: submitOffer
      summary: Submit a private offer
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOfferRequest"
      responses:
        "200":
          description: Offer receipt without its private terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/offer-withdrawals:
    post:
      tags: [Participation]
      operationId: withdrawOffer
      summary: Withdraw your own active offer before close
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawOfferRequest"
      responses:
        "200":
          description: Offer withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/offer-selections:
    post:
      tags: [Participation]
      operationId: selectOffers
      summary: Select offers as the requester after close
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectOffersRequest"
      responses:
        "200":
          description: Selection resolved into commitments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commitments/{commitmentId}/confirm:
    post:
      tags: [Commitments]
      operationId: confirmCommitment
      summary: Confirm a commitment
      description: |
        Records confirmation from a principal listed in
        requiredConfirmationPrincipalIds before expiresAt.
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentActionRequest"
            example:
              commandId: table-confirm-1
              principalId: diner-1
      responses:
        "200":
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commitments/{commitmentId}/decline:
    post:
      tags: [Commitments]
      operationId: declineCommitment
      summary: Decline a commitment
      description: |
        Declines a pending commitment before expiresAt. Direct-claim capacity is
        released. A sealed auction may promote the next eligible bid.
        Lottery creator decline requires a reason and promotes the next original
        candidate before the hard resolution deadline. Expiry never promotes.
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineCommitmentRequest"
            example:
              commandId: table-decline-1
              principalId: diner-1
      responses:
        "200":
          description: Commitment declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commitments/{commitmentId}/refund:
    post:
      tags: [Commitments]
      operationId: refundCommitment
      summary: Refund a settled commitment
      description: |
        Queues a full refund through the commitment's payment rail. The named
        principal must be the market creator; a delegated actor must cite
        `commitment:refund` authority. Refund does not undo the committed
        agreement or reopen market capacity. A terminally failed refund may be
        retried with a new command ID; the new payment operation and the prior
        failed attempt both remain in the record.
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentActionRequest"
            example:
              commandId: table-refund-1
              principalId: restaurant-1
      responses:
        "200":
          description: Full refund queued or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}:
    get:
      tags: [Markets]
      operationId: getMarket
      summary: Get a published market
      description: |
        Returns the safe public projection of a published market. Creating
        actors, authority references, private bid and offer identifiers,
        credential identifiers, commands, and payments are omitted. Drafts
        are indistinguishable from missing markets. No authentication is required.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketId"
      responses:
        "200":
          description: Current market snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMarket"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/activity:
    get:
      tags: [Markets]
      operationId: getMarketActivity
      summary: Get public market activity
      description: |
        Returns a safe event projection for a published market. It includes
        lifecycle types, times, public counts, states, outcomes, and clearing
        prices where applicable. It omits identities, command bodies, bid and
        offer identifiers, commitments, and payment references.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketId"
      responses:
        "200":
          description: Public market activity in recorded order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMarketActivity"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/record:
    get:
      tags: [Records]
      operationId: getMarketRecord
      summary: Get a market record
      description: |
        Returns commands, events, commitments, snapshots, and integrity metadata.
        Access is limited to the creator principal or the original creating
        actor with current market:create delegation. Delegated agents must
        supply principalId and authorityRef. Open sealed-auction bid requests
        are returned as {"sealed": true}.
        Open lotteries return 403 even to their creator; use lottery-review
        until resolution. Complete lottery audits are available after resolution.
      parameters:
        - $ref: "#/components/parameters/MarketId"
        - $ref: "#/components/parameters/ReadPrincipalId"
        - $ref: "#/components/parameters/ReadAuthorityRef"
      responses:
        "200":
          description: Complete authorized record view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/my-outcome:
    get:
      tags: [Markets]
      operationId: getMyMarketOutcome
      summary: Get your outcome in a market
      description: |
        Returns the public market snapshot and only the represented principal's
        accepted bid receipts, current offer states, lottery entry history and
        commitments. Private offer terms are omitted. Use a commitment ID here
        to confirm an allocation when participant confirmation is required.
        Lottery creator review requires the creator to confirm the award. An empty commitment list is not necessarily
        a final loss while promotion remains possible. Requires current claim,
        bid, offer-submission or lottery-entry authority for the market's mechanism.
      parameters:
        - $ref: "#/components/parameters/MarketId"
        - $ref: "#/components/parameters/ReadPrincipalId"
        - $ref: "#/components/parameters/ReadAuthorityRef"
      responses:
        "200":
          description: Principal-scoped participation and commitments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantMarketOutcome"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    AmbientActor:
      type: apiKey
      in: header
      name: X-Ambient-Actor
      description: Provisioned actor identifier.
    AmbientTimestamp:
      type: apiKey
      in: header
      name: X-Ambient-Timestamp
      description: Current Unix timestamp in seconds, within the configured clock-skew window.
    AmbientSignature:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Ambient-HMAC followed by a space and the unpadded base64url HMAC-SHA256
        signature. See Authentication and authority for the canonical input.
    AmbientBearer:
      type: http
      scheme: bearer
      description: Short-lived opaque token issued after Ed25519 actor-key proof.
    AmbientOperations:
      type: http
      scheme: bearer
      description: Independent high-entropy operations token used only by protected health and metrics monitors.

  parameters:
    ReadPrincipalId:
      name: principalId
      in: query
      required: false
      description: Principal represented for a private read; omit for self-representation.
      schema:
        type: string
        minLength: 1
    ReadAuthorityRef:
      name: authorityRef
      in: query
      required: false
      description: Current delegation reference when reading for another principal.
      schema:
        type: string
        minLength: 1
    MarketId:
      name: marketId
      in: path
      required: true
      description: Client-selected market identifier.
      schema:
        type: string
        minLength: 1
      example: table-2026-09-19-1900
    CommitmentId:
      name: commitmentId
      in: path
      required: true
      description: Commitment identifier returned by an allocation action.
      schema:
        type: string
        minLength: 1
    DelegationId:
      name: delegationId
      in: path
      required: true
      description: Client-selected delegation identifier.
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: Ambient credential identifier.
      schema:
        type: string
        minLength: 1
    PaymentCommandId:
      name: commandId
      in: path
      required: true
      description: Actor-scoped payment command identifier returned when authorization was queued.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: The JSON or command fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Request authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: request authentication failed
    Forbidden:
      description: The actor or principal is not authorized for this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested market, commitment, or route was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The command conflicts with current state, version, capacity, or idempotency history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The mechanism preset is unknown or its configuration is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The route does not support this method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The command could not be completed because of an internal failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AuthenticationChallengeRequest:
      type: object
      additionalProperties: false
      required: [actorId, keyId]
      properties:
        actorId:
          type: string
          minLength: 1
        keyId:
          type: string
          minLength: 1
    AuthenticationChallenge:
      type: object
      additionalProperties: false
      required: [id, actorId, keyId, audience, nonce, expiresAt, signingPayload]
      properties:
        id:
          type: string
        actorId:
          type: string
        keyId:
          type: string
        audience:
          type: string
        nonce:
          type: string
          description: Unpadded base64url nonce; repeat it during exchange.
        expiresAt:
          type: string
          format: date-time
        signingPayload:
          type: string
          description: Unpadded base64url bytes to sign directly with the registered Ed25519 private key.
    AuthenticationTokenRequest:
      type: object
      additionalProperties: false
      required: [challengeId, nonce, signature]
      properties:
        challengeId:
          type: string
        nonce:
          type: string
        signature:
          type: string
          description: Unpadded base64url Ed25519 signature over the decoded signingPayload.
    AuthenticationTokenGrant:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, actorId, expiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        actorId:
          type: string
        expiresAt:
          type: string
          format: date-time

    IdentityProvisioningRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, actorId, keyId, publicKey]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          type: string
          minLength: 1
        actorId:
          type: string
          minLength: 1
        keyId:
          type: string
          minLength: 1
        publicKey:
          type: string
          minLength: 43
          maxLength: 43
          description: Unpadded base64url encoding of a 32-byte Ed25519 public key.

    IdentityProvisioningResponse:
      type: object
      additionalProperties: false
      required: [principal, actor, key]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        actor:
          $ref: "#/components/schemas/Actor"
        key:
          $ref: "#/components/schemas/ActorKey"

    Principal:
      type: object
      additionalProperties: false
      required: [id, createdAt]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time

    Actor:
      type: object
      additionalProperties: false
      required: [id, createdAt]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time

    ActorKey:
      type: object
      additionalProperties: false
      required: [id, actorId, algorithm, publicKey, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: string
        algorithm:
          type: string
          const: Ed25519
        publicKey:
          type: string
          description: Unpadded base64url encoding of the registered public key.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    IssueCredentialRequest:
      type: object
      additionalProperties: false
      required: [commandId, credentialId, subjectPrincipalId, type, claims]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        credentialId:
          type: string
          minLength: 1
        subjectPrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        type:
          type: string
          minLength: 1
        claims:
          type: object
          additionalProperties: true
        validUntil:
          type: string
          format: date-time

    RevokeCredentialRequest:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"

    Credential:
      type: object
      additionalProperties: false
      required:
        - id
        - issuerPrincipalId
        - issuingActorId
        - subjectPrincipalId
        - type
        - claims
        - issuedAt
        - signingKeyId
        - payloadVersion
        - signature
      properties:
        id:
          type: string
        issuerPrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        issuingActorId:
          type: string
        authorityRef:
          type: string
        subjectPrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        type:
          type: string
        claims:
          type: object
          additionalProperties: true
        issuedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        signingKeyId:
          type: string
        payloadVersion:
          type: string
          const: ambient-credential.v1
        signature:
          type: string
          description: Unpadded base64url Ed25519 signature over the canonical Ambient credential payload.

    IssueDelegationRequest:
      type: object
      additionalProperties: false
      required: [commandId, delegationId, principalId, delegateActorId, scopes]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        delegationId:
          type: string
          minLength: 1
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        delegateActorId:
          type: string
          minLength: 1
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AuthorityScope"
        paymentMandate:
          $ref: "#/components/schemas/PaymentMandate"
          description: Required exactly when scopes includes payment:authorize.
        validUntil:
          type: string
          format: date-time

    RevokeDelegationRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"

    AuthorityScope:
      type: string
      enum:
        - market:create
        - market:publish
        - market:cancel
        - market:claim
        - market:bid
        - market:lottery_enter
        - market:offer_submit
        - market:offer_select
        - commitment:confirm
        - commitment:decline
        - commitment:refund
        - credential:issue
        - payment:authorize
        - payment:register_payee_rail

    PaymentMandate:
      type: object
      additionalProperties: false
      required: [railId, currency, maxAmountMinor]
      description: |
        Per-authorization bounds for delegated payment authority. This is not
        an aggregate spending budget. The containing delegation supplies the
        mandate expiry through validUntil.
      properties:
        railId:
          type: string
          minLength: 1
        currency:
          $ref: "#/components/schemas/Currency"
        maxAmountMinor:
          type: integer
          format: int64
          minimum: 1
        payeePrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        marketId:
          type: string
          minLength: 1

    Delegation:
      type: object
      additionalProperties: false
      required: [id, principalId, actorId, scopes, validFrom]
      properties:
        id:
          type: string
        principalId:
          type: string
        actorId:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityScope"
        paymentMandate:
          $ref: "#/components/schemas/PaymentMandate"
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    RegisterPayeeRailRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, railId, credentialTarget, privateReference]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        railId:
          type: string
          minLength: 1
        credentialTarget:
          type: string
          minLength: 1
          description: Public target participants use when obtaining rail-specific authorization material.
        privateReference:
          type: string
          minLength: 1
          writeOnly: true
          description: Private adapter routing reference. It is never returned to participants.

    AdminRegisterPayeeRailRequest:
      type: object
      additionalProperties: false
      required: [commandId, payeePrincipalId, railId, credentialTarget, privateReference]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        payeePrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        railId:
          type: string
          minLength: 1
        credentialTarget:
          type: string
          minLength: 1
        privateReference:
          type: string
          minLength: 1
          writeOnly: true

    PayeeRailRegistration:
      type: object
      additionalProperties: false
      required: [payeePrincipalId, railId, credentialType, credentialTarget, createdAt]
      properties:
        payeePrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        railId:
          type: string
        credentialType:
          type: string
        credentialTarget:
          type: string
        createdAt:
          type: string
          format: date-time

    QueuePaymentAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - authorizationId
        - railId
        - principalId
        - payeePrincipalId
        - marketId
        - amountMinor
        - currency
        - expiresAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        authorizationId:
          type: string
          minLength: 1
        railId:
          type: string
          minLength: 1
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        payeePrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        marketId:
          type: string
          minLength: 1
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: "#/components/schemas/Currency"
        expiresAt:
          type: string
          format: date-time
        paymentCredential:
          type: string
          minLength: 1
          writeOnly: true
          description: Private one-time authorization material required by some rails.

    PaymentOperation:
      type: object
      additionalProperties: false
      required:
        - commandId
        - kind
        - railId
        - authorizationId
        - identity
        - request
        - status
        - attempts
        - nextAttemptAt
        - occurredAt
        - recordedAt
        - updatedAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        kind:
          type: string
          const: payment.authorize
        railId:
          type: string
        authorizationId:
          type: string
        identity:
          $ref: "#/components/schemas/CommandIdentity"
        request:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, leased, succeeded, failed]
        attempts:
          type: integer
          format: uint32
        leaseUntil:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
        lastError:
          type: string
        rejectionCode:
          type: string
        result:
          $ref: "#/components/schemas/PaymentAuthorization"
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentOperationView:
      type: object
      additionalProperties: false
      required: [commandId, kind, railId, authorizationId, status, occurredAt, updatedAt]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        kind:
          type: string
          enum: [payment.authorize, payment.settle, payment.cancel, payment.refund]
        railId:
          type: string
        authorizationId:
          type: string
        status:
          type: string
          enum: [pending, leased, succeeded, failed]
        authorizationState:
          type: string
          enum: [authorized, settled, canceled, refunded]
        rejectionCode:
          type: string
          description: Stable Ambient rejection code. Provider error text is never returned.
        occurredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentAuthorization:
      type: object
      additionalProperties: false
      required:
        - id
        - railId
        - railReference
        - payerPrincipalId
        - payeePrincipalId
        - marketId
        - state
        - authorizedAmountMinor
        - settledAmountMinor
        - refundedAmountMinor
        - currency
        - authorizationExpiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        railId:
          type: string
        railReference:
          type: string
        payerPrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        payeePrincipalId:
          $ref: "#/components/schemas/PrincipalId"
        marketId:
          type: string
        commitmentId:
          type: string
        state:
          type: string
          enum: [authorized, settled, canceled, refunded]
        authorizedAmountMinor:
          type: integer
          format: int64
        settledAmountMinor:
          type: integer
          format: int64
        refundedAmountMinor:
          type: integer
          format: int64
        currency:
          $ref: "#/components/schemas/Currency"
        authorizationExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    CreateMarketRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, subject, mechanism]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        externalRef:
          type: string
          maxLength: 256
          description: Optional creator-private correlation reference. It is not unique and is not an idempotency key.
        discoverability:
          $ref: "#/components/schemas/MarketDiscoverability"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        subject:
          $ref: "#/components/schemas/Subject"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentSpec"
        mechanism:
          $ref: "#/components/schemas/MechanismSelection"
        funding:
          $ref: "#/components/schemas/FundingPolicy"

    PublishMarketRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        expectedVersion:
          type: integer
          format: uint64
          minimum: 1
          description: Current draft version returned by Ambient.
        credentialId:
          type: string
          minLength: 1
          description: Credential presented when a configured publication-admission rule matches the subject schema.
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"

    CancelMarketRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        expectedVersion:
          type: integer
          format: uint64
          minimum: 1
          description: Current open-market version returned by Ambient.
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"

    DirectClaimRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        expectedVersion:
          type: integer
          format: uint64
          minimum: 0
          description: Optional optimistic version check. Omit or send 0 for server arrival order.
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        paymentAuthorizationId:
          type: string
          minLength: 1
          description: Required when the market uses reserve_on_submission funding.
        fulfillment:
          $ref: "#/components/schemas/FulfillmentHandoff"

    SealedBidRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, amountMinor, currency]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Positive bid in minor currency units.
        currency:
          $ref: "#/components/schemas/Currency"
        paymentAuthorizationId:
          type: string
          minLength: 1
          description: Required when the market uses reserve_on_submission funding.

    SubmitOfferRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, terms]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        terms:
          $ref: "#/components/schemas/Subject"
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Fixed amount in the market currency when pricing permits or requires it.

    WithdrawOfferRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, offerId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        offerId:
          type: string
          minLength: 1

    SelectOffersRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, offerIds]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        offerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1

    EnterLotteryRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        evidenceUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Optional valid UTF-8 HTTPS URL without embedded credentials or surrounding whitespace, at most 2048 bytes. Ambient does not fetch, verify or deduplicate it.

    WithdrawLotteryRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId, entryId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        entryId:
          type: string
          minLength: 1

    DeclineCommitmentRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"
        reason:
          type: string
          maxLength: 2048
          description: Required for lottery creator decline; optional for other presets. Valid UTF-8, at most 2048 bytes, without surrounding whitespace.

    CommitmentActionRequest:
      type: object
      additionalProperties: false
      required: [commandId, principalId]
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        principalId:
          $ref: "#/components/schemas/PrincipalId"
        authorityRef:
          $ref: "#/components/schemas/AuthorityRef"

    CommandId:
      type: string
      minLength: 1
      description: Actor-scoped idempotency key. Retry the identical command with the same value.

    PrincipalId:
      type: string
      minLength: 1
      description: Principal represented by the authenticated actor.

    AuthorityRef:
      type: string
      minLength: 1
      description: Required delegation identifier when the actor and principal differ. Omit for self-action.

    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: Three-letter uppercase currency code.
      example: USD

    Subject:
      type: object
      additionalProperties: false
      required: [schema, data]
      properties:
        schema:
          type: string
          minLength: 1
          description: Versioned identifier chosen by the client for the subject data shape.
          example: restaurant-table.v1
        data:
          type: object
          description: Client-defined JSON object describing the item, service, capacity, or right being allocated.
          additionalProperties: true
          example:
            partySize: 2
            startsAt: "2026-09-19T19:00:00Z"

    FulfillmentEndpoint:
      type: object
      additionalProperties: false
      required: [transport, uri]
      properties:
        transport:
          type: string
          minLength: 1
          description: Lowercase transport identifier such as email, https, or a2a.
        uri:
          type: string
          format: uri
          description: Absolute contact or delivery URI. It must not contain credentials, secrets, or a fragment.

    FulfillmentSpec:
      type: object
      additionalProperties: false
      required: [requestSchema, acceptedDeliveryTransports, outputMediaTypes]
      properties:
        requestSchema:
          type: string
          minLength: 1
          description: Versioned schema required for participant requests.
        acceptedDeliveryTransports:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        providerEndpoint:
          $ref: "#/components/schemas/FulfillmentEndpoint"
        outputMediaTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 3
        slaSeconds:
          type: integer
          format: uint32
          minimum: 1
          description: Optional fulfillment target measured from commitment creation.

    FulfillmentHandoff:
      type: object
      additionalProperties: false
      required: [request, deliveryEndpoint]
      properties:
        request:
          $ref: "#/components/schemas/Subject"
        deliveryEndpoint:
          $ref: "#/components/schemas/FulfillmentEndpoint"

    FulfillmentTerms:
      type: object
      additionalProperties: false
      required: [spec, handoff]
      properties:
        spec:
          $ref: "#/components/schemas/FulfillmentSpec"
        handoff:
          $ref: "#/components/schemas/FulfillmentHandoff"

    MechanismSelection:
      description: Supported versioned allocation mechanism and its immutable configuration.
      oneOf:
        - $ref: "#/components/schemas/DirectClaimMechanism"
        - $ref: "#/components/schemas/SealedAuctionMechanism"
        - $ref: "#/components/schemas/RequestForOffersMechanism"
        - $ref: "#/components/schemas/LotteryMechanism"
      discriminator:
        propertyName: presetId
        mapping:
          direct-claim.v1: "#/components/schemas/DirectClaimMechanism"
          sealed-forward-auction.v1: "#/components/schemas/SealedAuctionMechanism"
          request-for-offers.v1: "#/components/schemas/RequestForOffersMechanism"
          lottery.v1: "#/components/schemas/LotteryMechanism"

    LotteryMechanism:
      type: object
      additionalProperties: false
      required: [presetId, config]
      properties:
        presetId:
          type: string
          const: lottery.v1
        config:
          oneOf:
            - $ref: "#/components/schemas/LotteryImmediateConfig"
            - $ref: "#/components/schemas/LotteryReviewedConfig"

    LotteryImmediateConfig:
      type: object
      additionalProperties: false
      required: [capacity, entryClosesAt, confirmation]
      properties:
        capacity:
          type: integer
          format: uint32
          minimum: 1
        entryClosesAt:
          type: string
          format: date-time
          description: Must follow publication; entries and withdrawals at or after it are rejected.
        confirmation:
          type: string
          const: none
        confirmationWindowSeconds: false
        resolutionDeadline: false
        eligibilityTerms:
          type: string
          maxLength: 8192
          description: At most 8192 UTF-8 bytes; described qualifications are not automatically verified. Funding must be none.

    LotteryReviewedConfig:
      type: object
      additionalProperties: false
      required: [capacity, entryClosesAt, confirmation, confirmationWindowSeconds, resolutionDeadline]
      properties:
        capacity:
          type: integer
          format: uint32
          minimum: 1
        entryClosesAt:
          type: string
          format: date-time
          description: Must follow publication.
        confirmation:
          type: string
          const: creator
        confirmationWindowSeconds:
          type: integer
          format: uint32
          minimum: 1
          description: Per-candidate review window from actual selection, capped at resolutionDeadline. Late selection or promotion can yield a shorter window, even nearly zero.
        resolutionDeadline:
          type: string
          format: date-time
          description: Must follow entryClosesAt; no awards or promotions after this deadline.
        eligibilityTerms:
          type: string
          maxLength: 8192
          description: At most 8192 UTF-8 bytes; creator evaluates evidence for provisional winners. Funding must be none.

    FundingPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, reserve_on_submission]
        acceptedRailIds:
          type: array
          items:
            type: string
            minLength: 1
          description: Rails accepted for funded participation.
        settlementGraceSeconds:
          type: integer
          format: uint32
          minimum: 0
          description: Additional authorization lifetime required beyond the mechanism horizon.

    DirectClaimMechanism:
      type: object
      additionalProperties: false
      required: [presetId, config]
      properties:
        presetId:
          type: string
          const: direct-claim.v1
        config:
          $ref: "#/components/schemas/DirectClaimConfig"

    SealedAuctionMechanism:
      type: object
      additionalProperties: false
      required: [presetId, config]
      properties:
        presetId:
          type: string
          const: sealed-forward-auction.v1
        config:
          $ref: "#/components/schemas/SealedAuctionConfig"

    RequestForOffersMechanism:
      type: object
      additionalProperties: false
      required: [presetId, config]
      properties:
        presetId:
          type: string
          const: request-for-offers.v1
        config:
          $ref: "#/components/schemas/RequestForOffersConfig"

    RequestForOffersConfig:
      type: object
      additionalProperties: false
      required: [capacity, offerSchema, offersCloseAt, selectionClosesAt, selectionTiming, pricing]
      properties:
        capacity:
          type: integer
          format: uint32
          minimum: 1
        offerSchema:
          type: string
          minLength: 1
        offersCloseAt:
          type: string
          format: date-time
          description: Must be after publication.
        selectionClosesAt:
          type: string
          format: date-time
          description: Must be after offersCloseAt.
        selectionTiming:
          type: string
          const: after_deadline
        pricing:
          $ref: "#/components/schemas/RequestForOffersPricing"

    RequestForOffersPricing:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, optional, required]
        currency:
          $ref: "#/components/schemas/Currency"
        maximumAmountMinor:
          type: integer
          format: int64
          minimum: 1
      description: None forbids currency and maximum; optional or required need one currency.

    DirectClaimConfig:
      description: Capacity, pricing, and confirmation rules for a direct-claim market.
      oneOf:
        - $ref: "#/components/schemas/DirectClaimImmediateConfig"
        - $ref: "#/components/schemas/DirectClaimHeldConfig"
      discriminator:
        propertyName: confirmation
        mapping:
          none: "#/components/schemas/DirectClaimImmediateConfig"
          creator: "#/components/schemas/DirectClaimHeldConfig"
          participant: "#/components/schemas/DirectClaimHeldConfig"
          both: "#/components/schemas/DirectClaimHeldConfig"

    DirectClaimImmediateConfig:
      type: object
      additionalProperties: false
      required: [capacity, pricing, confirmation]
      properties:
        capacity:
          type: integer
          format: uint32
          minimum: 1
          description: Number of successful commitments the market can allocate.
        pricing:
          $ref: "#/components/schemas/DirectClaimPricing"
        confirmation:
          type: string
          const: none
        holdDurationSeconds:
          type: integer
          format: uint32
          maximum: 0
          description: May be omitted. An explicit value must be 0 and is removed during normalization.
        maxPerPrincipal:
          type: integer
          format: uint32
          minimum: 1
          description: >-
            Optional cap on the live commitments one participant principal may
            hold. Declined, expired, and failed commitments release the
            allowance. Omit for no limit.
        claimsCloseAt:
          type: string
          format: date-time
          description: >-
            Optional RFC 3339 cutoff for accepting claims, which must be after
            publication. Claims at or after it are rejected and the market
            closes automatically.

    DirectClaimHeldConfig:
      type: object
      additionalProperties: false
      required: [capacity, pricing, confirmation, holdDurationSeconds]
      properties:
        capacity:
          type: integer
          format: uint32
          minimum: 1
          description: Number of successful commitments the market can allocate.
        pricing:
          $ref: "#/components/schemas/DirectClaimPricing"
        confirmation:
          type: string
          enum: [creator, participant, both]
          description: Principals that must confirm before the commitment is final.
        holdDurationSeconds:
          type: integer
          format: uint32
          minimum: 1
          description: Confirmation period before the commitment expires.
        maxPerPrincipal:
          type: integer
          format: uint32
          minimum: 1
          description: >-
            Optional cap on the live commitments one participant principal may
            hold. Declined, expired, and failed commitments release the
            allowance. Omit for no limit.
        claimsCloseAt:
          type: string
          format: date-time
          description: >-
            Optional RFC 3339 cutoff for accepting claims, which must be after
            publication. Claims at or after it are rejected and the market
            closes automatically.

    DirectClaimPricing:
      description: Free or posted terms recorded in the resulting commitment.
      oneOf:
        - $ref: "#/components/schemas/FreePricing"
        - $ref: "#/components/schemas/PostedPricing"
      discriminator:
        propertyName: mode
        mapping:
          free: "#/components/schemas/FreePricing"
          posted: "#/components/schemas/PostedPricing"

    FreePricing:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          const: free

    PostedPricing:
      type: object
      additionalProperties: false
      required: [mode, amountMinor, currency]
      properties:
        mode:
          type: string
          const: posted
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Positive posted amount in minor currency units.
        currency:
          $ref: "#/components/schemas/Currency"

    SealedAuctionConfig:
      type: object
      additionalProperties: false
      required: [currency, closesAt, holdDurationSeconds]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        reserveAmountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Optional positive reserve in minor currency units.
        closesAt:
          type: string
          format: date-time
          description: Fixed auction close. It must still be in the future when the draft is published.
        holdDurationSeconds:
          type: integer
          format: uint32
          minimum: 1
          description: Winner confirmation period after resolution.
        resolutionDeadline:
          type: string
          format: date-time
          description: >-
            Final promotion and resolution horizon, which must be after
            closesAt. Optional for unfunded auctions and required for funded
            ones, where funding must stay valid through it plus settlement
            grace.

    CommandIdentity:
      type: object
      additionalProperties: false
      required: [principalId, actorId]
      properties:
        principalId:
          type: string
          minLength: 1
          description: Principal whose rights or obligations are affected.
        actorId:
          type: string
          minLength: 1
          description: Authenticated actor that submitted the command.
        authorityRef:
          type: string
          minLength: 1
          description: Delegation used when actorId and principalId differ.

    MarketCreator:
      type: object
      additionalProperties: false
      required: [principalId]
      description: Creator principal; actor and delegation metadata are omitted from lottery action responses.
      properties:
        principalId:
          type: string
          minLength: 1
        actorId:
          type: string
          minLength: 1
        authorityRef:
          type: string
          minLength: 1

    MarketDiscoverability:
      type: string
      enum: [listed, unlisted]
      default: listed
      description: Listed markets appear in public discovery. Unlisted markets remain readable by exact market ID and are not private.

    Market:
      type: object
      additionalProperties: false
      required: [id, version, state, discoverability, creator, subject, mechanism, mechanismState, funding, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          description: Canonical identifier assigned by Ambient when the draft is created.
        externalRef:
          type: string
          maxLength: 256
          description: Optional creator-private correlation reference supplied at creation. Omitted from public market views.
        version:
          type: integer
          format: uint64
          minimum: 1
          description: Monotonically increasing version used for optimistic concurrency.
        state:
          type: string
          enum: [draft, open, closed, canceled]
        discoverability:
          $ref: "#/components/schemas/MarketDiscoverability"
        creator:
          $ref: "#/components/schemas/MarketCreator"
        subject:
          $ref: "#/components/schemas/Subject"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentSpec"
        mechanism:
          $ref: "#/components/schemas/MechanismSelection"
        mechanismState:
          description: Public state owned by the selected mechanism.
          oneOf:
            - $ref: "#/components/schemas/DirectClaimState"
            - $ref: "#/components/schemas/SealedAuctionState"
            - $ref: "#/components/schemas/RequestForOffersState"
            - $ref: "#/components/schemas/LotteryState"
        funding:
          $ref: "#/components/schemas/FundingPolicy"
        publicationCredentialId:
          type: string
          minLength: 1
          description: Credential verified by configured admission policy when the market was published.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MarketListPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicMarket"
        nextCursor:
          type: string
          minLength: 1
          description: Opaque cursor for the next page. Omitted on the final page.

    PublicMarket:
      type: object
      additionalProperties: false
      required: [id, version, state, discoverability, creatorPrincipalId, subject, mechanism, mechanismState, funding, publicationVerified, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: integer
          format: uint64
          minimum: 1
        state:
          type: string
          enum: [open, closed, canceled]
        discoverability:
          $ref: "#/components/schemas/MarketDiscoverability"
        creatorPrincipalId:
          type: string
          minLength: 1
          description: Principal responsible for the published market. Creating actor and authority details are omitted.
        subject:
          $ref: "#/components/schemas/Subject"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentSpec"
        mechanism:
          $ref: "#/components/schemas/MechanismSelection"
        mechanismState:
          type: object
          description: Preset-owned public state with private participation identifiers removed. Lottery exposes phase and activeEntryCount only, not digests or alternate positions.
        funding:
          $ref: "#/components/schemas/FundingPolicy"
        paymentCredentialInstructions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentCredentialInstruction"
        publicationVerified:
          type: boolean
          description: Whether configured publication admission verified a credential without disclosing its identifier.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ParticipantMarketOutcome:
      type: object
      additionalProperties: false
      required: [market, bidReceipts, offers, commitments]
      properties:
        market:
          $ref: "#/components/schemas/PublicMarket"
        bidReceipts:
          type: array
          description: Accepted sealed-bid receipts belonging to the represented principal.
          items:
            $ref: "#/components/schemas/SealedBidReceipt"
        offers:
          type: array
          description: Own offers with current state; private terms are omitted.
          items:
            $ref: "#/components/schemas/ParticipantOfferOutcome"
        lotteryEntries:
          type: array
          description: Own entries including withdrawal/re-entry history. Active is not an award; consult commitments. Empty commitments are not final loss while promotion remains possible.
          items:
            $ref: "#/components/schemas/LotteryEntryView"
        commitments:
          type: array
          description: Current commitments allocated to the represented principal.
          items:
            $ref: "#/components/schemas/Commitment"

    LotteryEntryView:
      type: object
      additionalProperties: false
      required: [id, state, submittedAt, updatedAt]
      properties:
        id:
          type: string
        evidenceUrl:
          type: string
        state:
          type: string
          enum: [active, withdrawn]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LotteryReviewView:
      type: object
      additionalProperties: false
      required: [market, candidates]
      properties:
        market:
          $ref: "#/components/schemas/PublicMarket"
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [entry, commitment]
            properties:
              entry:
                $ref: "#/components/schemas/LotteryEntryView"
              commitment:
                $ref: "#/components/schemas/Commitment"

    LotteryState:
      type: object
      additionalProperties: false
      required: [phase, activeEntryCount]
      properties:
        phase:
          type: string
          enum: [accepting_entries, awaiting_draw, awaiting_confirmation, resolved]
        activeEntryCount:
          type: integer
          minimum: 0
        entrySetDigest:
          type: string
        drawDigest:
          type: string
        nextEntryIndex:
          type: integer
          minimum: 0

    ParticipantOfferOutcome:
      type: object
      additionalProperties: false
      required: [id, state, submittedAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        state:
          type: string
          enum: [active, withdrawn, selected, not_selected, expired]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestForOffersView:
      type: object
      additionalProperties: false
      required: [market, offers]
      properties:
        market:
          $ref: "#/components/schemas/PublicMarket"
        offers:
          type: array
          description: Requester sees all, submitting provider sees own, other actors see none.
          items:
            $ref: "#/components/schemas/RequestForOfferView"

    RequestForOfferView:
      type: object
      additionalProperties: false
      required: [id, providerPrincipalId, terms, state, submittedAt, updatedAt]
      properties:
        id:
          type: string
        providerPrincipalId:
          type: string
        terms:
          $ref: "#/components/schemas/Subject"
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [active, withdrawn, selected, not_selected, expired]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicMarketActivity:
      type: object
      additionalProperties: false
      required: [marketId, items]
      properties:
        marketId:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicMarketActivityItem"

    PublicMarketActivityItem:
      type: object
      additionalProperties: false
      required: [sequence, type, marketVersion, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          description: Public lifecycle event type.
        marketVersion:
          type: integer
          format: uint64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          description: Event-specific public counts, states, outcomes, or clearing terms.

    PaymentCredentialInstruction:
      type: object
      additionalProperties: false
      required: [railId, credentialType, credentialTarget]
      properties:
        railId:
          type: string
          minLength: 1
        credentialType:
          type: string
          minLength: 1
        credentialTarget:
          type: string
          minLength: 1

    DirectClaimState:
      type: object
      additionalProperties: false
      required: [allocated]
      properties:
        allocated:
          type: integer
          format: uint32
          minimum: 0
          description: Capacity currently held or committed.

    SealedAuctionState:
      type: object
      additionalProperties: false
      required: [bidCount]
      properties:
        bidCount:
          type: integer
          format: uint32
          minimum: 0
          description: Number of accepted bids. Bid contents remain private.
        resolution:
          type: string
          enum: [winner_selected, no_trade]
        winningBidId:
          type: string
          minLength: 1
        excludedBidIds:
          type: array
          description: Bids excluded after a winner declines or expires.
          items:
            type: string
            minLength: 1

    RequestForOffersState:
      type: object
      additionalProperties: false
      required: [phase, activeOfferCount]
      properties:
        phase:
          type: string
          enum: [accepting_offers, awaiting_selection, resolved]
        activeOfferCount:
          type: integer
          format: uint32
          minimum: 0
        outcome:
          type: string
          enum: [offers_selected, no_selection]
        selectedOfferIds:
          type: array
          items:
            type: string
          description: Present in internal market results, omitted from public market projection.

    MarketResult:
      type: object
      additionalProperties: false
      required: [market, events]
      properties:
        market:
          $ref: "#/components/schemas/Market"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    MarketActionResult:
      type: object
      additionalProperties: false
      required: [market, commitments, events]
      properties:
        market:
          $ref: "#/components/schemas/Market"
        commitments:
          type: array
          description: Commitments created or changed by the command.
          items:
            $ref: "#/components/schemas/Commitment"
        bidReceipts:
          type: array
          description: Amount-free receipts returned after accepted sealed bids.
          items:
            $ref: "#/components/schemas/SealedBidReceipt"
        auctionResolution:
          $ref: "#/components/schemas/SealedAuctionResolution"
        offerReceipts:
          type: array
          description: Public-safe receipts returned after offer submission.
          items:
            $ref: "#/components/schemas/RequestForOfferReceipt"
        requestForOffersResolution:
          $ref: "#/components/schemas/RequestForOffersResolution"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    RequestForOfferReceipt:
      type: object
      additionalProperties: false
      required: [offerId, marketId, marketVersion, state, submittedAt]
      properties:
        offerId:
          type: string
        marketId:
          type: string
        marketVersion:
          type: integer
          format: uint64
        state:
          type: string
          enum: [active, withdrawn, selected, not_selected, expired]
        submittedAt:
          type: string
          format: date-time

    RequestForOffersResolution:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [offers_selected, no_selection]
        selectedOfferIds:
          type: array
          items:
            type: string

    Commitment:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - marketId
        - marketVersion
        - creatorPrincipalId
        - participantPrincipalId
        - state
        - terms
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: integer
          format: uint64
          minimum: 1
        marketId:
          type: string
          minLength: 1
        marketVersion:
          type: integer
          format: uint64
          minimum: 1
        creatorPrincipalId:
          type: string
          minLength: 1
        participantPrincipalId:
          type: string
          minLength: 1
        paymentAuthorizationId:
          type: string
          minLength: 1
        settlementState:
          type: string
          enum: [pending, settled, failed]
        settlementOperationId:
          type: string
          minLength: 1
        settlementFailureCode:
          type: string
          minLength: 1
        refundState:
          type: string
          enum: [pending, refunded, failed]
        refundOperationId:
          type: string
          minLength: 1
        refundFailureCode:
          type: string
          minLength: 1
        state:
          type: string
          enum: [provisional, awaiting_confirmations, committed, declined, expired, failed]
        terms:
          description: Immutable terms generated by the market mechanism.
          oneOf:
            - $ref: "#/components/schemas/DirectClaimCommitmentTerms"
            - $ref: "#/components/schemas/SealedAuctionCommitmentTerms"
        requiredConfirmationPrincipalIds:
          type: array
          items:
            type: string
            minLength: 1
        confirmedPrincipalIds:
          type: array
          items:
            type: string
            minLength: 1
        expiresAt:
          type: string
          format: date-time
          description: Confirmation deadline when the commitment is awaiting confirmation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DirectClaimCommitmentTerms:
      type: object
      additionalProperties: false
      required: [subject, pricing]
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        pricing:
          $ref: "#/components/schemas/DirectClaimPricing"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentTerms"

    SealedAuctionCommitmentTerms:
      type: object
      additionalProperties: false
      required: [subject, winningBidId, pricing]
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        winningBidId:
          type: string
          minLength: 1
        pricing:
          $ref: "#/components/schemas/SealedAuctionClearingPrice"

    SealedBidReceipt:
      type: object
      additionalProperties: false
      required: [bidId, marketId, marketVersion, state, submittedAt]
      properties:
        bidId:
          type: string
          minLength: 1
        marketId:
          type: string
          minLength: 1
        marketVersion:
          type: integer
          format: uint64
          minimum: 1
        state:
          type: string
          const: active
        submittedAt:
          type: string
          format: date-time

    SealedAuctionResolution:
      description: Public result produced at close or after deterministic winner promotion.
      oneOf:
        - $ref: "#/components/schemas/NoTradeResolution"
        - $ref: "#/components/schemas/WinnerSelectedResolution"
      discriminator:
        propertyName: outcome
        mapping:
          no_trade: "#/components/schemas/NoTradeResolution"
          winner_selected: "#/components/schemas/WinnerSelectedResolution"

    NoTradeResolution:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          const: no_trade

    WinnerSelectedResolution:
      type: object
      additionalProperties: false
      required: [outcome, winningBidId, winnerPrincipalId, clearingPrice]
      properties:
        outcome:
          type: string
          const: winner_selected
        winningBidId:
          type: string
          minLength: 1
        winnerPrincipalId:
          type: string
          minLength: 1
        clearingPrice:
          $ref: "#/components/schemas/SealedAuctionClearingPrice"

    SealedAuctionClearingPrice:
      type: object
      additionalProperties: false
      required: [rule, amountMinor, currency]
      properties:
        rule:
          type: string
          const: second_price
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Second-highest eligible bid or the reserve when higher. Zero is possible without a reserve and one bidder.
        currency:
          $ref: "#/components/schemas/Currency"

    Event:
      type: object
      additionalProperties: false
      required: [id, type, marketId, marketVersion, commandId, principalId, actorId, occurredAt, data]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Durable order in a market record. Immediate command results may omit it.
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - market.draft_created
            - market.published
            - market.canceled
            - direct_claim.accepted
            - direct_claim.closed
            - sealed_auction.bid_submitted
            - sealed_auction.resolved
            - request_for_offers.offer_submitted
            - request_for_offers.offer_withdrawn
            - request_for_offers.offer_selected
            - request_for_offers.offer_not_selected
            - request_for_offers.offer_expired
            - request_for_offers.offers_closed
            - request_for_offers.resolved
            - lottery.entry_submitted
            - lottery.entry_withdrawn
            - lottery.entries_closed
            - lottery.drawn
            - lottery.candidate_promoted
            - lottery.resolved
            - commitment.provisional
            - commitment.awaiting_confirmations
            - commitment.committed
            - commitment.confirmation_recorded
            - commitment.declined
            - commitment.expired
            - commitment.settlement_pending
            - commitment.settlement_settled
            - commitment.settlement_failed
            - commitment.refund_pending
            - commitment.refunded
            - commitment.refund_failed
        marketId:
          type: string
          minLength: 1
        marketVersion:
          type: integer
          format: uint64
          minimum: 1
        commandId:
          type: string
          minLength: 1
        principalId:
          type: string
          minLength: 1
        actorId:
          type: string
          minLength: 1
        authorityRef:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        data:
          description: Payload selected by event type.
          oneOf:
            - $ref: "#/components/schemas/MarketDraftCreatedEventData"
            - $ref: "#/components/schemas/MarketPublishedEventData"
            - $ref: "#/components/schemas/MarketCanceledEventData"
            - $ref: "#/components/schemas/DirectClaimAcceptedEventData"
            - $ref: "#/components/schemas/SealedBidSubmittedEventData"
            - $ref: "#/components/schemas/SealedAuctionResolution"
            - $ref: "#/components/schemas/CommitmentStateChangedEventData"
            - $ref: "#/components/schemas/CommitmentSettlementChangedEventData"
            - $ref: "#/components/schemas/CommitmentRefundChangedEventData"

    MarketDraftCreatedEventData:
      type: object
      additionalProperties: false
      required: [discoverability, creator, subject, mechanism, mechanismState]
      properties:
        discoverability:
          $ref: "#/components/schemas/MarketDiscoverability"
        creator:
          $ref: "#/components/schemas/CommandIdentity"
        subject:
          $ref: "#/components/schemas/Subject"
        fulfillment:
          $ref: "#/components/schemas/FulfillmentSpec"
        mechanism:
          $ref: "#/components/schemas/MechanismSelection"
        mechanismState:
          oneOf:
            - $ref: "#/components/schemas/DirectClaimState"
            - $ref: "#/components/schemas/SealedAuctionState"

    MarketPublishedEventData:
      type: object
      additionalProperties: false
      required: [previousState, state]
      properties:
        previousState:
          type: string
          const: draft
        state:
          type: string
          const: open
        publicationCredentialId:
          type: string
          minLength: 1

    MarketCanceledEventData:
      type: object
      additionalProperties: false
      required: [previousState, state]
      properties:
        previousState:
          type: string
          const: open
        state:
          type: string
          const: canceled

    DirectClaimAcceptedEventData:
      type: object
      additionalProperties: false
      required: [commitmentId, allocated, capacity]
      properties:
        commitmentId:
          type: string
          minLength: 1
        fulfillment:
          $ref: "#/components/schemas/FulfillmentHandoff"
        allocated:
          type: integer
          format: uint32
          minimum: 1
        capacity:
          type: integer
          format: uint32
          minimum: 1

    SealedBidSubmittedEventData:
      type: object
      additionalProperties: false
      required: [bidId, bidCount]
      properties:
        bidId:
          type: string
          minLength: 1
        bidCount:
          type: integer
          format: uint32
          minimum: 1

    CommitmentStateChangedEventData:
      type: object
      additionalProperties: false
      required: [commitmentId, state]
      properties:
        commitmentId:
          type: string
          minLength: 1
        state:
          type: string
          enum: [provisional, awaiting_confirmations, committed, declined, expired, failed]
        requiredConfirmationPrincipalIds:
          type: array
          items:
            type: string
            minLength: 1
        confirmedPrincipalIds:
          type: array
          items:
            type: string
            minLength: 1
        expiresAt:
          type: string
          format: date-time

    CommitmentSettlementChangedEventData:
      type: object
      additionalProperties: false
      required: [commitmentId, paymentOperationId, paymentAuthorizationId, settlementState]
      properties:
        commitmentId:
          type: string
          minLength: 1
        paymentOperationId:
          type: string
          minLength: 1
        paymentAuthorizationId:
          type: string
          minLength: 1
        settlementState:
          type: string
          enum: [pending, settled, failed]
        failureCode:
          type: string
          minLength: 1

    CommitmentRefundChangedEventData:
      type: object
      additionalProperties: false
      required: [commitmentId, paymentOperationId, paymentAuthorizationId, refundState]
      properties:
        commitmentId:
          type: string
          minLength: 1
        paymentOperationId:
          type: string
          minLength: 1
        paymentAuthorizationId:
          type: string
          minLength: 1
        refundState:
          type: string
          enum: [pending, refunded, failed]
        failureCode:
          type: string
          minLength: 1

    MarketRecord:
      type: object
      additionalProperties: false
      required: [market, commands, commitments, events, integrity]
      properties:
        market:
          $ref: "#/components/schemas/Market"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/RecordedCommand"
        commitments:
          type: array
          items:
            $ref: "#/components/schemas/Commitment"
        privateOffers:
          type: array
          description: Byte-preserved private offer snapshots, present only for creator-authorized request-for-offers records.
          items:
            $ref: "#/components/schemas/PrivateRequestForOffer"
        privateLotteryEntries:
          type: array
          description: Complete private entries, only in the creator-authorized audit record after lottery resolution.
          items:
            type: object
            required: [id, marketId, marketVersion, identity, state, submittedAt, updatedAt]
            properties:
              id:
                type: string
              marketId:
                type: string
              marketVersion:
                type: integer
              identity:
                $ref: "#/components/schemas/CommandIdentity"
              evidenceUrl:
                type: string
              state:
                type: string
                enum: [active, withdrawn]
              submittedAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        privateLotteryDraw:
          type: object
          description: Finalized draw for creator audit, not an operational participant/review view. Reproducibility does not prove honest randomness generation by Ambient.
          required: [algorithm, seed, entrySetDigest, orderedEntryIds]
          properties:
            algorithm:
              type: string
            seed:
              type: string
            entrySetDigest:
              type: string
            orderedEntryIds:
              type: array
              items:
                type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        integrity:
          $ref: "#/components/schemas/MarketRecordIntegrity"

    PrivateRequestForOffer:
      type: object
      additionalProperties: false
      required: [id, marketId, marketVersion, identity, terms, state, submittedAt, updatedAt]
      properties:
        id:
          type: string
        marketId:
          type: string
        marketVersion:
          type: integer
          format: uint64
        identity:
          $ref: "#/components/schemas/CommandIdentity"
        terms:
          $ref: "#/components/schemas/Subject"
        amountMinor:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, withdrawn, selected, not_selected, expired]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecordedCommand:
      type: object
      additionalProperties: false
      required: [sequence, id, type, marketId, identity, request, status, occurredAt, recordedAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - market.create_draft
            - market.publish
            - market.cancel
            - direct_claim.submit
            - direct_claim.close
            - sealed_auction.submit_bid
            - sealed_auction.resolve
            - request_for_offers.submit
            - request_for_offers.withdraw
            - request_for_offers.close
            - request_for_offers.select
            - request_for_offers.expire
            - lottery.enter
            - lottery.withdraw
            - lottery.close
            - lottery.draw
            - lottery.expire_undrawn
            - commitment.confirm
            - commitment.decline
            - commitment.expire
            - commitment.record_settlement_outcome
            - commitment.refund
            - commitment.record_refund_outcome
        marketId:
          type: string
          description: Empty only when a rejected command could not be associated with a market.
        identity:
          $ref: "#/components/schemas/CommandIdentity"
        request:
          type: object
          additionalProperties: true
          description: |
            Recorded application command, including server-assigned identity and
            time. An open sealed bid is redacted to {"sealed": true}.
        status:
          type: string
          enum: [accepted, rejected]
        rejectionCode:
          $ref: "#/components/schemas/ErrorCode"
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time

    MarketRecordIntegrity:
      type: object
      additionalProperties: false
      required: [algorithm, recordHash, stateReconstructed]
      properties:
        algorithm:
          type: string
          const: sha256-canonical-json-v1
        recordHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Unsigned content hash of the exact returned record view.
        stateReconstructed:
          type: boolean
          description: True when the current verifier reproduced stored snapshots from ordered decisions and events, checking RFO private offer bytes against submission digests.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable detail. Clients should branch on code.

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - identity_conflict
        - identity_not_found
        - invalid_credential
        - credential_conflict
        - signing_key_mismatch
        - delegation_not_found
        - delegation_conflict
        - delegation_inactive
        - not_found
        - method_not_allowed
        - idempotency_conflict
        - concurrent_update
        - internal_error
        - invalid_command
        - authority_reference_required
        - unknown_mechanism
        - invalid_mechanism_config
        - market_not_found
        - commitment_not_found
        - principal_not_authorized
        - version_conflict
        - invalid_market_transition
        - invalid_commitment_transition
        - actor_not_authorized
        - capacity_exhausted
        - invalid_payment_authorization
        - payment_authority_required
        - payment_mandate_exceeded
        - payment_rail_unavailable
        - payment_rail_unsupported
